name: canary

# Runs the suite against drizzle-kit's newest `rc`, so a new drizzle-kit release that needs a matching release of
# this package shows up here. If only the "is needed" tests fail, drizzle-kit fixed that case itself, and the
# package can drop its handling of it.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm ci
      - run: pnpm add -D drizzle-kit@rc drizzle-orm@rc
      - run: pnpm ls drizzle-kit drizzle-orm
      - run: pnpm run check
